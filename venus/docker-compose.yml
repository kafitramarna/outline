# VenusVerse prod stack: outline + postgres + redis behind Nginx Proxy Manager.
# CI rsyncs the repo to /opt/apps/outline then copies this file to
# /opt/apps/outline/docker-compose.yml before `deploy-app outline`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          # 'postgres' resolves to postgres_db on the shared app-network too,
          # so the app uses this unambiguous alias instead.
          - outline-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      default:
        aliases:
          - outline-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  outline:
    build:
      # Runs from /opt/apps/outline after CI copies this file to the repo root.
      context: .
      dockerfile: venus/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    # CLI 'production' forces dialectOptions.ssl; runtime honors PGSSLMODE itself.
    command: sh -c "./node_modules/.bin/sequelize db:migrate --env production-ssl-disabled && node ./build/server/index.js"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3020:3000"
    volumes:
      - outline-data:/var/lib/outline/data
    networks:
      - default
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  postgres-data:
  outline-data:

networks:
  app-network:
    external: true
